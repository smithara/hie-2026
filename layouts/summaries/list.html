{{ define "main" }}
<section class="page-head">
  <div class="wrap">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<div class="page-intro"><p>{{ . }}</p></div>{{ end }}
  </div>
</section>

<section>
  <div class="wrap summaries summaries-layout">
    <aside class="summaries-toc" aria-label="Sessions">
      <p class="summaries-toc-title">Sessions</p>
      {{ .TableOfContents }}
    </aside>
    <div class="summaries-body">{{ .Content }}</div>
  </div>
</section>
{{ end }}
