{{- $links := .Site.Params.links -}}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}">
      <span class="brand-mark" aria-hidden="true">☀</span>
      <span class="brand-text">{{ .Site.Params.shortTitle }}</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </label>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ .Site.Home.RelPermalink }}">Home</a>
      <a href="{{ "posters/" | relURL }}">Posters</a>
      <a href="{{ "summaries/" | relURL }}">Summaries</a>
      <a href="{{ $links.schedule }}" target="_blank" rel="noopener">Schedule&nbsp;↗</a>
      {{ with .Site.Params.zulip.invite }}<a class="btn btn-primary btn-sm" href="{{ . }}" target="_blank" rel="noopener">Zulip Registration&nbsp;↗</a>{{ end }}
    </nav>
  </div>
</header>
